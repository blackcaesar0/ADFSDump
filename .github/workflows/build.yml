name: Build ADFSDump

on:
  push:
    branches: [master, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build (Release)
        run: dotnet build ADFSDump.sln -c Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ADFSDump
          path: |
            ADFSDump/bin/Release/net452/ADFSDump.exe
            ADFSDump/bin/Release/net452/ADFSDump.exe.config
          if-no-files-found: error
